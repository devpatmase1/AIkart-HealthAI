services:
  - type: web
    name: aikart-healthai
    env: python
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && cd democlient && npm install && npm run build && cd .. && pip install --prefer-binary -r requirements.txt"
    startCommand: "python -m uvicorn app:app --host 0.0.0.0 --port $PORT --app-dir src"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SCENARIO
        value: default
      - key: OPENAI_MODEL_ID
        value: gemini-2.0-flash
      - key: APP_BLOB_STORAGE_ENDPOINT
        value: local
